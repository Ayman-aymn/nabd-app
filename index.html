<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#eef2ff;min-height:100vh;color:#1e293b;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(800px at 10% 0%, rgba(91,141,239,.18), transparent),radial-gradient(600px at 90% 100%, rgba(139,92,246,.15), transparent);pointer-events:none}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:90px}
/* شاشة الدخول */
#authScreen{position:fixed;inset:0;background:#eef2ff;z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;gap:15px}
#authScreen h1{font-size:48px;color:#3b82f6;text-shadow:0 0 20px rgba(59,130,246,0.3)}
#authScreen input{width:100%;max-width:350px;padding:15px;border-radius:15px;border:1px solid #3b82f6;background:#fff;color:#1e293b;font-size:16px;text-align:center;outline:none}
#authScreen button{width:100%;max-width:350px;padding:15px;border-radius:15px;border:none;background:linear-gradient(135deg,#5b8def,#8b5cf6);color:#fff;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 4px 15px rgba(91,141,239,0.4)}
#authScreen .switch{color:#8b5cf6;cursor:pointer;text-decoration:underline;font-size:14px}
/* هيدر */
.header{margin:14px;padding:12px 16px;background:rgba(255,255,255,.85);border:1px solid rgba(91,141,239,.15);border-radius:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(91,141,239,.12), inset 0 1px 0 rgba(255,255,255,.9)}
.logo{font-size:28px;font-weight:900;color:#3b82f6;display:flex;align-items:center;gap:8px}
.logo b{color:#8b5cf6}
.hBtn{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid rgba(91,141,239,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.06)}
/* بحث */
.island{margin:0 14px;width:calc(100% - 28px);padding:14px 18px;background:rgba(255,255,255,.9);border:1px solid rgba(91,141,239,.2);border-radius:20px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 8px 24px rgba(91,141,239,.12), inset 0 1px 0 #fff;transition:.35s cubic-bezier(.4,0,.2,1)}
.island.expanded{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:100vh;z-index:100;border-radius:0;padding:20px;background:rgba(238,242,255,.96);backdrop-filter:blur(16px);flex-direction:column;align-items:stretch}
.dot{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5b8def,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(91,141,239,.3)}
.island input{flex:1;background:transparent;border:none;color:#1e293b;outline:none;font-size:15px;font-weight:600}
.island input::placeholder{color:#94a3b8}
.sugs{display:none;margin-top:18px;flex:1;overflow-y:auto}
.island.expanded .sugs{display:block}
.sugGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{padding:12px;background:#fff;border:1px solid rgba(91,141,239,.12);border-radius:14px;display:flex;gap:10px;align-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.sug img{width:36px;height:36px;border-radius:50%}
/* قصص */
.stories{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex-shrink:0;text-align:center;cursor:pointer}
.bubbleWrap{width:74px;height:74px;border-radius:28px 28px 28px 12px;background:linear-gradient(135deg, rgba(255,255,255,.9), rgba(91,141,239,.12));border:1px solid rgba(91,141,239,.18);box-shadow:0 6px 18px rgba(91,141,239,.15), inset 0 2px 0 #fff;display:flex;align-items:center;justify-content:center;transition:.3s}
.bubbleWrap:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 12px 28px rgba(91,141,239,.25)}
.bubbleWrap img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.bubbleWrap.add{background:rgba(255,255,255,.6);border:2px dashed rgba(139,92,246,.3)}
.stName{font-size:11px;margin-top:6px;color:#475569;font-weight:600}
/* محادثات */
.block{margin:16px 14px 0}
.bTitle{font-weight:800;font-size:16px;margin-bottom:10px;color:#1e293b;display:flex;justify-content:space-between}
.chat{padding:12px;background:#fff;border:1px solid rgba(91,141,239,.1);border-radius:18px;display:flex;gap:12px;align-items:center;margin-bottom:10px;cursor:pointer;box-shadow:0 4px 16px rgba(91,141,239,.08), inset 0 1px 0 #fff;transition:.2s}
.chat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(91,141,239,.15)}
.chat.unread{border-color:rgba(91,141,239,.35);background:linear-gradient(135deg,#fff, rgba(91,141,239,.06))}
.cAv{width:50px;height:50px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.cInfo{flex:1;min-width:0}
.cName{font-weight:700;font-size:15px;color:#0f172a}
.cLast{font-size:12.5px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cMeta{font-size:11px;color:#94a3b8;text-align:left;flex-shrink:0}
.badge{background:linear-gradient(135deg,#5b8def,#8b5cf6);color:#fff;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:4px;box-shadow:0 2px 8px rgba(91,141,239,.3)}
/* شريط التنقل */
.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:400px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid rgba(91,141,239,.15);border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;box-shadow:0 12px 32px rgba(91,141,239,.15);z-index:20}
.navItem{text-align:center;font-size:10px;color:#94a3b8;cursor:pointer;font-weight:600}
.navItem.active{color:#5b8def}
.navItem i{font-size:20px;display:block;margin-bottom:2px;font-style:normal}
/* محادثة */
#chatView{position:fixed;inset:0;max-width:430px;margin:0 auto;background:#eef2ff;display:none;flex-direction:column;z-index:90}
.bubbles{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.5;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,#5b8def,#6366f1);color:#fff;border-bottom-left-radius:6px}
.bubble.other{align-self:flex-start;background:#fff;border:1px solid rgba(0,0,0,.05);color:#1e293b;border-bottom-right-radius:6px}
.inputBar{padding:10px;background:rgba(255,255,255,.9);border-top:1px solid rgba(91,141,239,.1);display:flex;gap:8px;align-items:center}
.inputBar input{flex:1;padding:12px 16px;border-radius:22px;border:1px solid rgba(91,141,239,.15);outline:none;background:#f8fafc}
.sendBtn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#5b8def,#8b5cf6);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(91,141,239,.3)}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="authScreen">
  <h1>نبض</h1>
  <input type="text" id="username" placeholder="اسم المستخدم" />
  <input type="password" id="password" placeholder="كلمة المرور" />
  <button id="authBtn" onclick="handleAuth()">تسجيل الدخول</button>
  <p class="switch" id="switchMode" onclick="toggleAuthMode()">ليس لديك حساب؟ إنشاء حساب</p>
</div>

<div class="app" id="listView" style="display:none">
  <div class="header"><div class="logo">نبض <b>♡</b></div><div style="display:flex;gap:8px"><div class="hBtn" onclick="newChat()">💬+</div><div class="hBtn" onclick="logout()">🚪</div></div></div>

  <div class="island" id="island" onclick="if(!this.classList.contains('expanded')) expand()">
    <div class="dot">⌕</div>
    <input id="searchI" placeholder="ابحث في المحادثات..." oninput="doFilter(this.value)" onfocus="expand()">
    <span id="closeX" style="display:none;font-size:18px" onclick="event.stopPropagation(); collapse()">✕</span>
    <div class="sugs" id="sugs">
      <div style="color:#64748b;font-size:13px;margin-bottom:10px">اقتراحات سريعة</div>
      <div class="sugGrid" id="sugGrid"></div>
      <div style="margin-top:20px;padding:14px;background:#fff;border-radius:14px;text-align:center;border:1px solid rgba(91,141,239,.1);cursor:pointer" onclick="collapse()">إغلاق ←</div>
    </div>
  </div>

  <div class="block"><div class="bTitle"><span>القصص</span></div><div class="stories" id="storiesMain"></div></div>
  <div class="block"><div class="bTitle"><span>الدردشات</span><span style="color:#8b5cf6;font-size:12px" id="count"></span></div><div id="chatList"></div></div>

  <div class="bottom">
    <div class="navItem active"><i>💬</i>الدردشات</div>
    <div class="navItem" onclick="alert('المكالمات قريباً')"><i>📞</i>مكالمات</div>
    <div class="navItem" onclick="alert('الحالات قريباً')"><i>📷</i>حالات</div>
    <div class="navItem" onclick="logout()"><i>⚙️</i>خروج</div>
  </div>
</div>

<!-- شاشة المحادثة -->
<div id="chatView">
  <div class="header"><div class="hBtn" onclick="closeChat()">‹</div><div style="flex:1;display:flex;gap:10px;align-items:center"><div id="cvImg" class="cAv" style="display:flex;justify-content:center;align-items:center;font-weight:900;background:#1e293b;color:#60a5fa;"></div><div><div id="cvName" style="font-weight:800;font-size:14px"></div><div style="font-size:11px;color:#22c55e">متصل الآن</div></div></div></div>
  <div class="bubbles" id="bubbles"></div>
  <div class="inputBar"><input id="msgInp" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')send()"><button class="sendBtn" onclick="send()">➤</button></div>
</div>

<script type="module">
  let isLogin = true;
  let currentUser = null;
  let currentConversationId = null;
  let currentChatName = null;

  window.toggleAuthMode = () => {
    isLogin = !isLogin;
    document.getElementById('authBtn').innerText = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
    document.getElementById('switchMode').innerText = isLogin ? 'ليس لديك حساب؟ إنشاء حساب' : 'لديك حساب؟ تسجيل الدخول';
  };

  window.handleAuth = async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) return alert('يرجى ملء جميع الحقول');
    const email = username + '@nabd.app';
    let result;
    if (isLogin) {
      result = await window.supabase.auth.signInWithPassword({ email, password });
    } else {
      result = await window.supabase.auth.signUp({ email, password });
      if (!result.error) {
        const { data: { user } } = await window.supabase.auth.getUser();
        if (user) await window.supabase.from('profiles').insert({ id: user.id, username: username });
        result = await window.supabase.auth.signInWithPassword({ email, password });
      }
    }
    if (result.error) alert(result.error.message);
    else { currentUser = result.data.user; await initUser(); }
  };

  window.logout = async () => { await window.supabase.auth.signOut(); location.reload(); };

  async function initUser() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('listView').style.display = 'flex';
    await loadConversations();
    setupRealtime();
  }

  async function loadConversations() {
    const { data } = await window.supabase.from('conversations').select('*, user1_profile:profiles!conversations_user1_fkey(username), user2_profile:profiles!conversations_user2_fkey(username)').or(`user1.eq.${currentUser.id},user2.eq.${currentUser.id}`);
    const chatList = document.getElementById('chatList');
    chatList.innerHTML = '';
    if (data) {
      data.forEach(conv => {
        const otherUser = conv.user1 === currentUser.id ? conv.user2_profile.username : conv.user1_profile.username;
        const div = document.createElement('div');
        div.className = 'chat';
        div.onclick = () => openChat(conv.id, otherUser);
        div.innerHTML = `<div class="cAv" style="display:flex;justify-content:center;align-items:center;background:#1e293b;font-weight:900;color:#60a5fa;">${otherUser[0]}</div><div class="cInfo"><div class="cName">${otherUser}</div><div class="cLast">اضغط للمحادثة</div></div>`;
        chatList.appendChild(div);
      });
    }
  }

  window.newChat = async () => {
    const username = prompt('ابحث عن اسم المستخدم:');
    if (!username) return;
    const { data: profile, error } = await window.supabase.from('profiles').select('id').eq('username', username).single();
    if (error || !profile) return alert('المستخدم غير موجود');
    const { data: existing } = await window.supabase.from('conversations').select('id').or(`and(user1.eq.${currentUser.id},user2.eq.${profile.id}),and(user1.eq.${profile.id},user2.eq.${currentUser.id})`).single();
    if (existing) openChat(existing.id, username);
    else {
      const { data: newConv } = await window.supabase.from('conversations').insert({ user1: currentUser.id, user2: profile.id }).select().single();
      await loadConversations();
      openChat(newConv.id, username);
    }
  };

  window.openChat = async (convId, username) => {
    currentConversationId = convId;
    currentChatName = username;
    document.getElementById('cvName').innerText = username;
    document.getElementById('cvImg').innerText = username[0];
    document.getElementById('listView').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    await loadMessages(convId);
  };

  window.closeChat = () => {
    document.getElementById('chatView').style.display = 'none';
    document.getElementById('listView').style.display = 'flex';
    currentConversationId = null;
  };

  async function loadMessages(convId) {
    const { data } = await window.supabase.from('messages').select('*').eq('conversation_id', convId).order('created_at', { ascending: true });
    const bubbles = document.getElementById('bubbles');
    bubbles.innerHTML = '';
    if (data) {
      data.forEach(m => addBubble(m.text, m.sender_id === currentUser.id));
      bubbles.scrollTop = bubbles.scrollHeight;
    }
  }

  function addBubble(text, isMe) {
    const div = document.createElement('div');
    div.className = `bubble ${isMe ? 'me' : 'other'}`;
    div.innerHTML = text;
    document.getElementById('bubbles').appendChild(div);
    document.getElementById('bubbles').scrollTop = document.getElementById('bubbles').scrollHeight;
  }

  window.send = async () => {
    const inp = document.getElementById('msgInp');
    if (!inp.value.trim() || !currentConversationId) return;
    const text = inp.value;
    await window.supabase.from('messages').insert({ conversation_id: currentConversationId, sender_id: currentUser.id, text });
    inp.value = '';
  };

  function setupRealtime() {
    window.supabase.channel('custom-all-channel').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const newMsg = payload.new;
      if (newMsg.conversation_id === currentConversationId) addBubble(newMsg.text, newMsg.sender_id === currentUser.id);
    }).subscribe();
  }

  const { data: { session } } = await window.supabase.auth.getSession();
  if (session) { currentUser = session.user; await initUser(); }
</script>
</body>
</html>
