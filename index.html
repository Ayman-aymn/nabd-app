<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>نبض - Nabd</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
  const supabase = createClient('https://lmgshabrtmvbnpdhkkst.supabase.co', 'sb_publishable_XCTUMu79wWd2wQFmM51vVg_nec2Glwb')
  window.supabase = supabase;
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0f1e;min-height:100vh;color:#fff;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(800px 400px at 20% -10%, rgba(59,130,246,.25), transparent),radial-gradient(600px 400px at 80% 20%, rgba(168,85,247,.25), transparent),radial-gradient(400px 300px at 50% 100%, rgba(59,130,246,.15), transparent);z-index:-1}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:90px}
/* شاشة الدخول */
#authScreen{position:fixed;inset:0;background:#0a0f1e;z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;gap:15px}
#authScreen h1{font-size:48px;color:#60a5fa;text-shadow:0 0 20px #3b82f6}
#authScreen input{width:100%;max-width:350px;padding:15px;border-radius:15px;border:1px solid #3b82f6;background:rgba(0,0,0,0.5);color:#fff;font-size:16px;text-align:center;outline:none}
#authScreen button{width:100%;max-width:350px;padding:15px;border-radius:15px;border:none;background:linear-gradient(135deg,#3b82f6,#a855f7);color:#fff;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 0 15px #3b82f6}
#authScreen .switch{color:#a855f7;cursor:pointer;text-decoration:underline;font-size:14px}
/* هيدر زجاجي */
.top{margin:10px;padding:14px 16px;background:rgba(255,255,255,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:20px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1)}
.logo{font-size:36px;font-weight:900;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:8px}
.logo i{width:36px;height:36px;background:linear-gradient(135deg,#3b82f6,#a855f7);border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;-webkit-text-fill-color:#fff;box-shadow:0 0 12px rgba(59,130,246,.6)}
.top .acts{margin-right:auto;display:flex;gap:8px}
.iconBtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px)}
/* بحث */
.searchWrap{margin:0 10px 14px;padding:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;display:flex;align-items:center}
.searchWrap input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;color:#fff;outline:none;font-size:14px}
/* محادثات */
.chatCard{margin:0 10px 10px;padding:12px;background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:18px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}
.chatCard:active{transform:scale(.98)}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(255,255,255,.1)}
.chatInfo{flex:1;min-width:0}
.chatName{font-weight:700;font-size:16px}
.chatLast{font-size:13px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
/* شاشة محادثة */
#chatView{display:none;flex-direction:column;min-height:100vh}
.chatHeader{position:sticky;top:0;margin:10px;padding:10px 12px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:18px;display:flex;align-items:center;gap:10px;z-index:10}
.bubbles{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:78%;padding:10px 12px;border-radius:18px;font-size:14px;line-height:1.5;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1)}
.bubble.me{align-self:flex-end;background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.4);border-bottom-left-radius:6px}
.bubble.other{align-self:flex-start;background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.35);border-bottom-right-radius:6px}
.bubble .t{font-size:10px;opacity:.5;margin-top:4px;text-align:left}
.inputBar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:410px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:8px;display:flex;gap:8px;align-items:center;z-index:15}
.inputBar input{flex:1;background:rgba(255,255,255,.07);border:none;border-radius:18px;padding:10px 12px;color:#fff;outline:none}
.sendBtn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#a855f7);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff;font-size:18px}
/* شريط التنقل السفلي */
.bottomNav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;justify-content:space-around;padding:10px 0;background:rgba(10,15,30,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.1);z-index:20}
.navItem{display:flex;flex-direction:column;align-items:center;color:#64748b;font-size:11px;cursor:pointer;transition:0.3s}
.navItem.active{color:#60a5fa;text-shadow:0 0 10px #3b82f6}
.navIcon{font-size:22px;margin-bottom:2px}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="authScreen">
  <h1>نبض</h1>
  <input type="text" id="username" placeholder="اسم المستخدم" />
  <input type="password" id="password" placeholder="كلمة المرور" />
  <button id="authBtn" onclick="handleAuth()">تسجيل الدخول</button>
  <p class="switch" id="switchMode" onclick="toggleAuthMode()">ليس لديك حساب؟ إنشاء حساب</p>
</div>

<div class="app" id="listView" style="display:none">
  <div class="top">
    <div class="logo"><i>♡</i> نبض</div>
    <div class="acts">
      <div class="iconBtn" onclick="toggleSearch()">🔍</div>
      <div class="iconBtn" onclick="openCamera()">📷</div>
      <div class="iconBtn" onclick="logout()">🚪</div>
    </div>
  </div>

  <div class="searchWrap" id="searchBar">
    <input id="searchInput" placeholder="بحث عن اسم المستخدم..." oninput="searchUser(this.value)">
    <span style="margin-right:8px;opacity:.6">🔍</span>
  </div>

  <div class="section">
    <div class="sectionTitle">المحادثات</div>
    <div id="chatList"></div>
  </div>

  <div class="fab" onclick="newChat()" style="position:fixed;bottom:80px;left:50%;transform:translateX(120px);width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#a855f7);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;box-shadow:0 8px 24px rgba(59,130,246,.5);z-index:20">💬+</div>
</div>

<!-- شاشة محادثة -->
<div id="chatView">
  <div class="chatHeader">
    <div class="iconBtn" onclick="closeChat()">‹</div>
    <div class="avatar" id="cvAvatar" style="width:40px;height:40px;display:flex;justify-content:center;align-items:center;font-weight:900;"></div>
    <div style="flex:1"><div id="cvName" style="font-weight:800"></div><div style="font-size:11px;color:#60a5fa">متصل الآن</div></div>
    <div class="iconBtn" onclick="alert('مكالمة صوتية')">📞</div>
    <div class="iconBtn" onclick="alert('مكالمة فيديو')">🎥</div>
  </div>
  <div class="bubbles" id="bubbles"></div>
  <div class="inputBar">
    <div class="iconBtn" onclick="alert('إرفاق ملف')">+</div>
    <input id="msgInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="sendBtn" onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- شريط التنقل السفلي -->
<div class="bottomNav" id="bottomNav" style="display:none">
  <div class="navItem active" onclick="switchTab('listView')"><span class="navIcon">💬</span>الدردشات</div>
  <div class="navItem" onclick="alert('الحالات - قريباً')"><span class="navIcon">📸</span>الحالات</div>
  <div class="navItem" onclick="alert('المكالمات - قريباً')"><span class="navIcon">📞</span>المكالمات</div>
  <div class="navItem" onclick="logout()"><span class="navIcon">⚙️</span>خروج</div>
</div>

<script type="module">
  let isLogin = true;
  let currentUser = null;
  let currentConversationId = null;
  let currentChatName = null;

  window.toggleAuthMode = () => {
    isLogin = !isLogin;
    document.getElementById('authBtn').innerText = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
    document.getElementById('switchMode').innerText = isLogin ? 'ليس لديك حساب؟ إنشاء حساب' : 'لديك حساب؟ تسجيل الدخول';
  };

  window.handleAuth = async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) return alert('يرجى ملء جميع الحقول');
    const email = username + '@nabd.app';
    let result;
    if (isLogin) {
      result = await window.supabase.auth.signInWithPassword({ email, password });
    } else {
      result = await window.supabase.auth.signUp({ email, password });
      if (!result.error) {
        const { data: { user } } = await window.supabase.auth.getUser();
        if (user) await window.supabase.from('profiles').insert({ id: user.id, username: username });
        result = await window.supabase.auth.signInWithPassword({ email, password });
      }
    }
    if (result.error) alert(result.error.message);
    else { currentUser = result.data.user; await initUser(); }
  };

  window.logout = async () => { await window.supabase.auth.signOut(); location.reload(); };

  async function initUser() {
    const { data: { user } } = await window.supabase.auth.getUser();
    if (!user) return;
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('listView').style.display = 'flex';
    document.getElementById('bottomNav').style.display = 'flex';
    await loadConversations();
    setupRealtime();
  }

  async function loadConversations() {
    const { data } = await window.supabase.from('conversations').select('*, user1_profile:profiles!conversations_user1_fkey(username), user2_profile:profiles!conversations_user2_fkey(username)').or(`user1.eq.${currentUser.id},user2.eq.${currentUser.id}`);
    const chatList = document.getElementById('chatList');
    chatList.innerHTML = '';
    if (data) {
      data.forEach(conv => {
        const otherUser = conv.user1 === currentUser.id ? conv.user2_profile.username : conv.user1_profile.username;
        const div = document.createElement('div');
        div.className = 'chatCard';
        div.onclick = () => openChat(conv.id, otherUser);
        div.innerHTML = `<div class="avatar" style="display:flex;justify-content:center;align-items:center;background:#1e293b;font-weight:900;color:#60a5fa">${otherUser[0]}</div><div class="chatInfo"><div class="chatName">${otherUser}</div><div class="chatLast">اضغط للمحادثة</div></div>`;
        chatList.appendChild(div);
      });
    }
  }

  window.newChat = async () => {
    const username = prompt('ابحث عن اسم المستخدم:');
    if (!username) return;
    const { data: profile, error } = await window.supabase.from('profiles').select('id').eq('username', username).single();
    if (error || !profile) return alert('المستخدم غير موجود');
    const { data: existing } = await window.supabase.from('conversations').select('id').or(`and(user1.eq.${currentUser.id},user2.eq.${profile.id}),and(user1.eq.${profile.id},user2.eq.${currentUser.id})`).single();
    if (existing) openChat(existing.id, username);
    else {
      const { data: newConv } = await window.supabase.from('conversations').insert({ user1: currentUser.id, user2: profile.id }).select().single();
      await loadConversations();
      openChat(newConv.id, username);
    }
  };

  window.openChat = async (convId, username) => {
    currentConversationId = convId;
    currentChatName = username;
    document.getElementById('cvName').innerText = username;
    document.getElementById('cvAvatar').innerText = username[0];
    document.getElementById('listView').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    document.getElementById('bottomNav').style.display = 'none';
    await loadMessages(convId);
  };

  window.closeChat = () => {
    document.getElementById('chatView').style.display = 'none';
    document.getElementById('listView').style.display = 'flex';
    document.getElementById('bottomNav').style.display = 'flex';
    currentConversationId = null;
  };

  async function loadMessages(convId) {
    const { data } = await window.supabase.from('messages').select('*').eq('conversation_id', convId).order('created_at', { ascending: true });
    const bubbles = document.getElementById('bubbles');
    bubbles.innerHTML = '';
    if (data) {
      data.forEach(m => addBubble(m.text, m.sender_id === currentUser.id, m.created_at));
      bubbles.scrollTop = bubbles.scrollHeight;
    }
  }

  function addBubble(text, isMe, time) {
    const div = document.createElement('div');
    div.className = `bubble ${isMe ? 'me' : 'other'}`;
    div.innerHTML = `${text}<div class="t">${new Date(time).toLocaleTimeString()}</div>`;
    document.getElementById('bubbles').appendChild(div);
    document.getElementById('bubbles').scrollTop = document.getElementById('bubbles').scrollHeight;
  }

  window.sendMsg = async () => {
    const inp = document.getElementById('msgInput');
    if (!inp.value.trim() || !currentConversationId) return;
    const text = inp.value;
    await window.supabase.from('messages').insert({ conversation_id: currentConversationId, sender_id: currentUser.id, text });
    inp.value = '';
  };

  function setupRealtime() {
    window.supabase.channel('custom-all-channel').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const newMsg = payload.new;
      if (newMsg.conversation_id === currentConversationId) addBubble(newMsg.text, newMsg.sender_id === currentUser.id, newMsg.created_at);
    }).subscribe();
  }

  const { data: { session } } = await window.supabase.auth.getSession();
  if (session) { currentUser = session.user; await initUser(); }
</script>
</body>
</html>
