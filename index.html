<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الريان للترجمة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
window.supabase = createClient('https://lmgshabrtmvbnpdhkkst.supabase.co', 'sb_publishable_XCTUMu79wWd2wQFmM51vVg_nec2Glwb')
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(1200px 600px at 20% 0%, #eef2ff 0%, #d8e2ff 20%, #c9d5ff 40%, #c7b8ff 85%, #b8a6ff 100%);color:#2f365f}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:12px 18px 100px}
.header{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;margin-bottom:10px}
.logo{font-size:30px;font-weight:900;color:#5b5bd6}
.island{width:100%;height:56px;background:linear-gradient(180deg, rgba(255,255,255,0.85), rgba(235,240,255,0.9));border:1.5px solid #fff;border-radius:28px;display:flex;align-items:center;gap:12px;padding:0 20px;margin-bottom:16px}
.island input{flex:1;border:none;background:transparent;outline:none;font-size:16px;font-weight:700;color:#3a3a6e}
.section{font-size:18px;font-weight:800;color:#2a2a5a;margin:24px 6px 16px}
.card{background:rgba(255,255,255,0.85);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px rgba(120,130,220,0.1)}
.textarea{width:100%;height:100px;border:1.5px solid #ddd;border-radius:16px;padding:12px;font-family:'Tajawal';font-size:16px;resize:none}
.btn{width:100%;height:48px;border-radius:16px;border:none;background:linear-gradient(135deg,#7c8aff,#8b5cf6);color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
.result{background:#f8f8ff;border-radius:16px;padding:12px;margin-top:10px;border:1.5px solid #ddd;font-size:16px;min-height:50px}
.bottom{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:380px;height:56px;background:linear-gradient(180deg, #fff, #eef2ff);border:1.5px solid #fff;border-radius:28px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 12px 32px rgba(120,130,220,0.2)}
.bottom button{width:44px;height:44px;border-radius:14px;border:none;background:transparent;font-size:22px;color:#9aa0d0;cursor:pointer}
.bottom button.active{background:#fff;color:#6b6ee6}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div class="logo">الريان للترجمة</div><div style="width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center" onclick="logout()">🚪</div></div>
  
  <div class="card">
    <h3 style="margin-bottom:10px">ترجمة نص</h3>
    <textarea id="inputText" class="textarea" placeholder="اكتب النص هنا..."></textarea>
    <button class="btn" onclick="translateText()">ترجمة</button>
    <div id="resultText" class="result" style="display:none"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px">رفع ملف (PDF/PPTX)</h3>
    <input type="file" id="fileInput" accept=".pdf,.pptx" style="width:100%">
    <button class="btn" onclick="uploadFile()">ترجمة الملف</button>
    <div id="fileStatus" class="result" style="display:none"></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px">سجل الترجمات</h3>
    <div id="historyList" style="font-size:14px;color:#6b6b9a">لا توجد ترجمات بعد.</div>
  </div>

  <div class="bottom">
    <button class="active">🌐</button>
    <button onclick="alert('القاموس قريباً')">📚</button>
    <button onclick="alert('الإعدادات قريباً')">⚙️</button>
    <button onclick="logout()">🚪</button>
  </div>
</div>

<script type="module">
let currentUser = null;

// شاشة الدخول
const authScreen = document.createElement('div');
authScreen.style.cssText = 'position:fixed;inset:0;background:radial-gradient(#eef2ff,#d8e2ff);z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:20px';
authScreen.innerHTML = `<h1 style="font-size:44px;color:#6366f1;font-weight:900">الريان للترجمة</h1><input id="user" placeholder="اسم المستخدم" style="width:100%;max-width:320px;height:52px;border-radius:26px;border:1px solid #fff;padding:0 20px;background:#fff"><input id="pass" type="password" placeholder="كلمة المرور" style="width:100%;max-width:320px;height:52px;border-radius:26px;border:1px solid #fff;padding:0 20px;background:#fff"><button onclick="handleAuth()" style="width:100%;max-width:320px;height:52px;border-radius:26px;border:none;background:linear-gradient(135deg,#7c8aff,#8b5cf6);color:#fff;font-weight:800">دخول / تسجيل</button>`;
document.body.appendChild(authScreen);

window.handleAuth = async () => {
  const u = document.getElementById('user').value.trim().replace(/[^a-zA-Z0-9_]/g,'');
  const p = document.getElementById('pass').value;
  if(!u || !p) return alert('اكمل البيانات');
  const email = u + '@nabd.app';
  let res = await window.supabase.auth.signInWithPassword({email, password:p});
  if(res.error){
    res = await window.supabase.auth.signUp({email, password:p});
    if(!res.error){
      const {data:{user}} = await window.supabase.auth.getUser();
      if(user) await window.supabase.from('profiles').insert({id:user.id, username:u}).catch(()=>{});
      res = await window.supabase.auth.signInWithPassword({email, password:p});
    }
  }
  if(res.error) alert(res.error.message);
  else { currentUser = res.data.user; authScreen.style.display='none'; loadHistory(); }
};

window.logout = async () => { await window.supabase.auth.signOut(); location.reload(); };

window.translateText = async () => {
  const text = document.getElementById('inputText').value.trim();
  if(!text) return alert('اكتب نصاً للترجمة');
  
  // البحث في القاموس أولاً
  let {data} = await window.supabase.from('dictionary').select('target_text').eq('source_text', text).maybeSingle();
  let translated;
  
  if(data) {
    translated = data.target_text;
  } else {
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ar`);
      const json = await res.json();
      translated = json.responseData.translatedText;
      // تخزين في القاموس
      await window.supabase.from('dictionary').insert({source_text: text, target_text: translated});
    } catch(e) {
      translated = 'فشل الاتصال بخدمة الترجمة';
    }
  }
  
  const resultDiv = document.getElementById('resultText');
  resultDiv.style.display = 'block';
  resultDiv.innerText = translated;
  
  // حفظ في السجل
  if(currentUser) {
    await window.supabase.from('history').insert({user_id: currentUser.id, original_text: text, translated_text: translated, type: 'text'});
    loadHistory();
  }
};

window.uploadFile = () => {
  alert('ميزة ترجمة الملفات قيد التطوير (ستعمل قريباً)');
};

window.loadHistory = async () => {
  if(!currentUser) return;
  const {data} = await window.supabase.from('history').select('*').eq('user_id', currentUser.id).order('created_at', {ascending:false}).limit(10);
  const list = document.getElementById('historyList');
  if(data && data.length > 0) {
    list.innerHTML = data.map(h => `<div style="padding:10px;background:#fff;border-radius:10px;margin-bottom:6px"><b>${h.original_text}</b> → ${h.translated_text}</div>`).join('');
  } else {
    list.innerHTML = 'لا توجد ترجمات بعد.';
  }
};

const {data:{session}} = await window.supabase.auth.getSession();
if(session) { currentUser = session.user; authScreen.style.display='none'; loadHistory(); }
</script>
</body>
</html>
